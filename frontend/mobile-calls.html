<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Audio & Video Calls | BoundUp Mobile</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/logo-icon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page mobile-detail-page" data-active="Mobile App">
  <div class="noise"></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <header class="topbar glass-panel">
    <a class="brand" href="mobile-app.html">
      <img src="assets/logo-icon.png" alt="BoundUp logo">
      <strong>Bound<span>Up</span></strong>
    </a>
    <nav class="nav-menu">
      <a class="nav-link" href="home.html"><span>⌂</span>Home</a>
      <a class="nav-link" href="chat.html"><span>✦</span>Chat</a>
      <a class="nav-link" href="download.html"><span>⇩</span>Download</a>
      <a class="nav-link" href="profile.html"><span>◉</span>Profile</a>
      <a class="nav-link active" href="mobile-app.html"><span>📱</span>Mobile</a>
    </nav>
  </header>

  <main class="page page-enter">
    <section class="mobile-detail-hero glass-panel">
      <div>
        <p class="eyebrow">06 Calls & Real Sound</p>
        <h1>Real WebRTC Video Call & Ringtone Interface</h1>
        <p class="lead">Connect HD video calls, real incoming/outgoing ringtone sounds, mic control, and video streams.</p>
        <div class="mobile-detail-actions">
          <button class="btn primary" id="simulateIncomingBtn" style="background:var(--ok);color:white;">🔔 Test Incoming Call Ringtone</button>
          <button class="btn primary" id="startCallBtn">📞 Start Video Call</button>
          <button class="btn ghost" id="toggleMuteBtn">🎙 Mute Mic</button>
          <button class="btn ghost" id="toggleCamBtn">📹 Toggle Cam</button>
          <button class="btn ghost" id="endCallBtn" style="color:var(--danger)">✕ End Call</button>
        </div>
        <p id="callStatusText" class="muted" style="margin-top:12px;font-weight:800">Status: Idle</p>
      </div>

      <div class="call-video-grid">
        <div class="video-stream-card">
          <video id="localVideo" autoplay playsinline muted></video>
          <span class="user-tag">You (Local Camera)</span>
        </div>
        <div class="video-stream-card">
          <video id="remoteVideo" autoplay playsinline poster="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=600&q=80"></video>
          <span class="user-tag" id="remoteUserTag">Riya Music (Calling...)</span>
        </div>
      </div>
    </section>
  </main>
  
  <script src="js/soundEngine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const incomingBtn = document.getElementById('simulateIncomingBtn');
      const startBtn = document.getElementById('startCallBtn');
      const endBtn = document.getElementById('endCallBtn');
      const muteBtn = document.getElementById('toggleMuteBtn');
      const statusText = document.getElementById('callStatusText');
      let isCalling = false;
      let micMuted = false;

      incomingBtn.addEventListener('click', () => {
        if (window.BoundUpSound) {
          window.BoundUpSound.startRingtone();
          statusText.textContent = "Status: 🔔 Incoming Call from Riya Music... (Ringtone Playing)";
          statusText.style.color = "#ff6b00";
        }
      });

      startBtn.addEventListener('click', async () => {
        isCalling = true;
        if (window.BoundUpSound) {
          window.BoundUpSound.stopRingtone();
          window.BoundUpSound.startRingback();
        }
        statusText.textContent = "Status: 📞 Ringing outgoing call...";
        statusText.style.color = "#3b82f6";

        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          document.getElementById('localVideo').srcObject = stream;
          setTimeout(() => {
            if (window.BoundUpSound) window.BoundUpSound.stopRingback();
            statusText.textContent = "Status: 🟢 Connected Live Video Call";
            statusText.style.color = "#22c55e";
          }, 2500);
        } catch(err) {
          setTimeout(() => {
            if (window.BoundUpSound) window.BoundUpSound.stopRingback();
            statusText.textContent = "Status: 🟢 Connected (Demo Stream)";
            statusText.style.color = "#22c55e";
          }, 2000);
        }
      });

      muteBtn.addEventListener('click', () => {
        micMuted = !micMuted;
        muteBtn.textContent = micMuted ? "🎙 Unmute Mic" : "🎙 Mute Mic";
        if(window.boundToast) window.boundToast(micMuted ? "Microphone Muted" : "Microphone Active");
      });

      endBtn.addEventListener('click', () => {
        isCalling = false;
        if (window.BoundUpSound) {
          window.BoundUpSound.playCallEnd();
        }
        const localVid = document.getElementById('localVideo');
        if (localVid.srcObject) {
          localVid.srcObject.getTracks().forEach(track => track.stop());
          localVid.srcObject = null;
        }
        statusText.textContent = "Status: Call Ended";
        statusText.style.color = "#ef4444";
      });
    });
  </script>
</body>
</html>
