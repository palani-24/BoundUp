<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <title>Audio & Video Calls | BoundUp Mobile</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/logo-icon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="app-page mobile-detail-page" data-active="Mobile App">
  <div class="noise"></div>
  <div class="cursor-glow" id="cursorGlow"></div>
  <header class="topbar glass-panel">
    <a class="brand" href="mobile-app.html">
      <img src="assets/logo-icon.png" alt="BoundUp logo">
      <strong>Bound<span>Up</span></strong>
    </a>
    <nav class="nav-menu">
      <a class="nav-link" href="home.html"><span>⌂</span>Home</a>
      <a class="nav-link" href="chat.html"><span>✦</span>Chat</a>
      <a class="nav-link" href="download.html"><span>⇩</span>Download</a>
      <a class="nav-link" href="profile.html"><span>◉</span>Profile</a>
      <a class="nav-link active" href="mobile-app.html"><span>📱</span>Mobile</a>
    </nav>
  </header>

  <main class="page page-enter">
    <section class="mobile-detail-hero glass-panel">
      <div>
        <p class="eyebrow">06 Calls & WebRTC</p>
        <h1>Real WebRTC Video Call Interface</h1>
        <p class="lead">Connect HD video calls, camera preview, microphone mute, speaker mode, and live signaling.</p>
        <div class="mobile-detail-actions">
          <button class="btn primary" id="startCallBtn">📞 Start Video Call</button>
          <button class="btn ghost" id="toggleMuteBtn">🎙 Mute Mic</button>
          <button class="btn ghost" id="toggleCamBtn">📹 Toggle Cam</button>
          <button class="btn ghost" id="endCallBtn" style="color:var(--danger)">✕ End Call</button>
        </div>
        <p id="callStatusText" class="muted" style="margin-top:12px;font-weight:800">Status: Camera Ready</p>
      </div>

      <div class="call-video-grid">
        <div class="video-stream-card">
          <video id="localVideo" autoplay playsinline muted></video>
          <span class="user-tag">You (Local Camera)</span>
        </div>
        <div class="video-stream-card">
          <video id="remoteVideo" autoplay playsinline poster="assets/avatar-2.svg"></video>
          <span class="user-tag" id="remoteUserTag">Arun (BoundUp Contact)</span>
        </div>
      </div>
    </section>
  </main>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
