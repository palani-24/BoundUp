<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | BoundUp</title>
  <meta name="theme-color" content="#ff6b00">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/soundEngine.js"></script>
  <script defer src="js/data.js"></script>
  <script defer src="js/pwaInstall.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="bg-orbs"></div>
  <div class="shell">
    <main class="main">
      <section class="page fade-up">
        <div class="feed-layout">
          <div class="feed-col">
            <div id="stories" class="stories glass"></div>
            
            <section id="create" class="post glass glow-card">
              <form id="createPostForm">
                <div class="post-head" style="border-bottom:1px solid var(--line);padding:14px 16px;">
                  <div class="user-mini">
                    <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Avatar">
                    <span><b>BoundUp Creator Suite</b><small>Share Feed Post, HD Reel or Instant Story</small></span>
                  </div>
                </div>

                <!-- Create Type Tabs (Post / Reel / Story) -->
                <div class="create-tab-bar">
                  <button type="button" class="create-tab-btn active" data-tab="post">📸 Feed Post</button>
                  <button type="button" class="create-tab-btn" data-tab="reel">🎬 HD Reel</button>
                  <button type="button" class="create-tab-btn" data-tab="story">📖 Story</button>
                </div>

                <div class="post-body" style="padding:16px;">
                  <!-- Caption / Text Field -->
                  <textarea id="newCaption" rows="3" placeholder="What's on your mind? Write caption..." style="width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:18px;padding:14px;color:var(--text);outline:0;resize:vertical"></textarea>
                  
                  <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display:none">

                  <!-- Common Media Preview -->
                  <div id="mediaPreviewContainer" class="media-preview-box hidden" style="width:100%;margin-top:12px;">
                    <img id="mediaPreviewImg" src="" alt="Upload Preview" class="hidden">
                    <video id="mediaPreviewVideo" controls src="" class="hidden" style="width:100%;max-height:260px;border-radius:16px;object-fit:cover;"></video>
                    <button type="button" class="remove-media" id="removeMediaBtn">✕</button>
                  </div>

                  <!-- 📸 1. POST EDIT OPTIONS -->
                  <div id="postEditOptions" class="create-options-panel">
                    <div class="edit-row">
                      <label>🎨 Filter:</label>
                      <select id="postFilterSelect">
                        <option value="none">✨ Normal (No Filter)</option>
                        <option value="sepia(0.6)">📜 Vintage Sepia</option>
                        <option value="grayscale(1)">🏁 Grayscale</option>
                        <option value="saturate(1.8)">🌈 Neon Saturate</option>
                        <option value="contrast(1.4) hue-rotate(15deg)">🌅 Warm Sunset</option>
                      </select>
                    </div>
                    <div class="edit-row">
                      <label>📍 Location:</label>
                      <input id="postLocationInput" placeholder="Add location (e.g. Chennai, India)">
                    </div>
                    <div class="edit-row">
                      <label>🏷️ Tag People:</label>
                      <input id="postTagInput" placeholder="Tag friends (e.g. @riya.vibe)">
                    </div>
                  </div>

                  <!-- 🎬 2. REEL EDIT OPTIONS -->
                  <div id="reelEditOptions" class="create-options-panel hidden">
                    <div class="edit-row">
                      <label>🎵 Audio Track:</label>
                      <select id="videoAudioTrackSelect">
                        <option value="love1">💕 Kadhale Kadhale • Flute Romance</option>
                        <option value="love2">💕 Nira Nira • Acoustic Sunset</option>
                        <option value="love3">💕 Kannazhaga • Soft Violin</option>
                        <option value="love4">💕 Anbae Anbae • Acoustic Cut</option>
                        <option value="love5">💕 Unakkaga • Piano Romance</option>
                        <option value="mass">🔥 Tamil Mass BGM Drop</option>
                        <option value="chill">🎧 Chill Lo-Fi Beat</option>
                        <option value="original">🎙️ Original Video Sound</option>
                      </select>
                    </div>
                    <div class="edit-row">
                      <label>⚡ Playback Speed:</label>
                      <select id="reelSpeedSelect">
                        <option value="1">1.0x (Normal Speed)</option>
                        <option value="0.5">0.5x (Slow Motion)</option>
                        <option value="1.5">1.5x (Fast Vibe)</option>
                        <option value="2">2.0x (Hyper Speed)</option>
                      </select>
                    </div>
                  </div>

                  <!-- 📖 3. STORY EDIT OPTIONS -->
                  <div id="storyEditOptions" class="create-options-panel hidden">
                    <div class="edit-row">
                      <label>🎨 Background Canvas:</label>
                      <select id="storyBgSelect">
                        <option value="linear-gradient(135deg, #ff6b00, #7c2cff)">🔥 Neon Orange & Purple</option>
                        <option value="linear-gradient(135deg, #00f0ff, #7c2cff)">🌌 Cyber Cyan</option>
                        <option value="linear-gradient(135deg, #ff007a, #ff6b00)">🌸 Sunset Pink</option>
                        <option value="linear-gradient(135deg, #10b981, #064e3b)">🌲 Emerald Green</option>
                      </select>
                    </div>
                    <div class="edit-row">
                      <label>🎵 Story BGM:</label>
                      <select id="storyMusicSelect">
                        <option value="love1">💕 Romantic Flute BGM</option>
                        <option value="love2">🎸 Acoustic Love Melody</option>
                        <option value="chill">🎧 Chill Lo-Fi Vibe</option>
                      </select>
                    </div>
                    <div class="edit-row">
                      <label>⏳ Expiry Duration:</label>
                      <select id="storyDurationSelect">
                        <option value="24h">24 Hours (Standard Story)</option>
                        <option value="12h">12 Hours (Quick Story)</option>
                        <option value="permanent">⭐ Permanent Highlight</option>
                      </select>
                    </div>
                  </div>

                  <!-- Action Buttons -->
                  <div class="btn-row" style="align-items:center;justify-content:space-between;margin-top:14px;">
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                      <button type="button" class="ghost-btn" id="uploadFileTrigger">🎬 Add Media</button>
                      <button type="button" class="ghost-btn" id="aiCaptionBtn">✨ AI Caption</button>
                    </div>
                    <button class="primary-btn" id="createSubmitBtn">Publish Feed Post 🚀</button>
                  </div>
                </div>
              </form>
            </section>

            <div id="feed"></div>
          </div>
          
          <aside id="rightPanel" class="right-panel"></aside>
        </div>
      </section>
    </main>
  </div>

  <!-- Full-Screen Interactive Story Viewer Modal -->
  <div id="storyViewerModal" class="story-modal-overlay hidden">
    <div class="story-card-view">
      <div class="story-header-overlay">
        <div class="story-progress-row" id="storyProgressRow">
          <div class="story-progress-bar"><div class="story-progress-fill" id="storyProgressFill"></div></div>
        </div>
        <div class="story-user-info">
          <div class="u-details">
            <img class="avatar" id="storyAvatar" src="assets/avatar-1.svg" alt="Story User">
            <span id="storyUsername"><b>username</b></span>
          </div>
          <button class="story-close-btn" id="closeStoryBtn">✕</button>
        </div>
      </div>
      <div class="story-nav-left" id="storyNavLeft"></div>
      <div class="story-nav-right" id="storyNavRight"></div>
      <img class="story-media-view" id="storyImg" src="" alt="Story View">
      <div class="story-footer-input">
    </div>
  </div>

  <!-- Full-Screen Interactive Video & Real Song Player Modal -->
  <div id="videoPlayerModal" class="video-modal-overlay hidden">
    <div class="video-modal-card">
      <button type="button" class="video-modal-close" id="closeVideoModalBtn">✕</button>
      <video id="modalVideoPlayer" class="video-modal-player" src="" loop autoplay playsinline></video>
      <div class="video-modal-info">
        <div class="video-modal-author">
          <img id="modalVideoAvatar" src="" alt="Author">
          <div>
            <span id="modalVideoAuthorName"><b>User Name</b></span>
            <small style="display:block;opacity:0.75" id="modalVideoAuthorHandle">@username</small>
          </div>
        </div>
        <p class="video-modal-title" id="modalVideoCaption">Video Caption</p>
        <div class="video-modal-audio-badge">
          <div class="sound-wave-icon"><span style="background:white"></span><span style="background:white"></span><span style="background:white"></span></div>
          <span id="modalVideoAudioTitle">🎵 Audio Song Title</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/soundEngine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/pwaInstall.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
