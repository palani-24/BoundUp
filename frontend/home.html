<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home | BoundUp</title>
  <meta name="theme-color" content="#ff6b00">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/data.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <div class="bg-orbs"></div>
  <div class="shell">
    <main class="main">
      <section class="page fade-up">
        <div class="feed-layout">
          <div class="feed-col">
            <div id="stories" class="stories glass"></div>
            
            <section id="create" class="post">
              <form id="createPostForm">
                <div class="post-head">
                  <div class="user-mini">
                    <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Avatar">
                    <span><b>Create Post / Video Reel</b><small>Upload photos or MP4 videos with sound</small></span>
                  </div>
                </div>
                <div class="post-body">
                  <textarea id="newCaption" rows="3" placeholder="What's happening on BoundUp? Write a caption..." style="width:100%;border:0;background:var(--panel2);border-radius:18px;padding:14px;color:var(--text);outline:0;resize:vertical"></textarea>
                  
                  <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display:none">
                  
                  <div id="mediaPreviewContainer" class="media-preview-box hidden" style="width:100%;margin-top:12px;">
                    <img id="mediaPreviewImg" src="" alt="Upload Preview" class="hidden">
                    <video id="mediaPreviewVideo" controls src="" class="hidden" style="width:100%;max-height:240px;border-radius:16px;object-fit:cover;"></video>
                    <button type="button" class="remove-media" id="removeMediaBtn">✕</button>
                  </div>

                  <div id="audioSelectContainer" class="sound-select-row hidden">
                    <span style="font-size:13px;font-weight:800">🎵 Audio Track:</span>
                    <select id="videoAudioTrackSelect">
                      <option value="love1">💕 Kadhale Kadhale • Flute Romance</option>
                      <option value="love2">💕 Nira Nira • Acoustic Sunset</option>
                      <option value="love3">💕 Kannazhaga • Soft Violin</option>
                      <option value="love4">💕 Anbae Anbae • Acoustic Cut</option>
                      <option value="love5">💕 Unakkaga • Piano Romance</option>
                      <option value="mass">🔥 Tamil Mass BGM Drop</option>
                      <option value="chill">🎧 Chill Lo-Fi Beat</option>
                      <option value="original">🎙️ Original Video Audio</option>
                    </select>
                  </div>
                  
                  <div class="btn-row" style="align-items:center;justify-content:space-between;margin-top:12px;">
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                      <button type="button" class="ghost-btn" id="uploadFileTrigger">🎬 Add Video / Photo</button>
                      <button type="button" class="ghost-btn" id="aiCaptionBtn">✨ AI Caption</button>
                    </div>
                    <button class="primary-btn" id="createPostSubmitBtn">Publish Post</button>
                  </div>
                </div>
              </form>
            </section>

            <div id="feed"></div>
          </div>
          
          <aside id="rightPanel" class="right-panel"></aside>
        </div>
      </section>
    </main>
  </div>

  <!-- Full-Screen Interactive Story Viewer Modal -->
  <div id="storyViewerModal" class="story-modal-overlay hidden">
    <div class="story-card-view">
      <div class="story-header-overlay">
        <div class="story-progress-row" id="storyProgressRow">
          <div class="story-progress-bar"><div class="story-progress-fill" id="storyProgressFill"></div></div>
        </div>
        <div class="story-user-info">
          <div class="u-details">
            <img class="avatar" id="storyAvatar" src="assets/avatar-1.svg" alt="Story User">
            <span id="storyUsername"><b>username</b></span>
          </div>
          <button class="story-close-btn" id="closeStoryBtn">✕</button>
        </div>
      </div>
      <div class="story-nav-left" id="storyNavLeft"></div>
      <div class="story-nav-right" id="storyNavRight"></div>
      <img class="story-media-view" id="storyImg" src="" alt="Story View">
      <div class="story-footer-input">
    </div>
  </div>

  <!-- Full-Screen Interactive Video & Real Song Player Modal -->
  <div id="videoPlayerModal" class="video-modal-overlay hidden">
    <div class="video-modal-card">
      <button type="button" class="video-modal-close" id="closeVideoModalBtn">✕</button>
      <video id="modalVideoPlayer" class="video-modal-player" src="" loop autoplay playsinline></video>
      <div class="video-modal-info">
        <div class="video-modal-author">
          <img id="modalVideoAvatar" src="" alt="Author">
          <div>
            <span id="modalVideoAuthorName"><b>User Name</b></span>
            <small style="display:block;opacity:0.75" id="modalVideoAuthorHandle">@username</small>
          </div>
        </div>
        <p class="video-modal-title" id="modalVideoCaption">Video Caption</p>
        <div class="video-modal-audio-badge">
          <div class="sound-wave-icon"><span style="background:white"></span><span style="background:white"></span><span style="background:white"></span></div>
          <span id="modalVideoAudioTitle">🎵 Audio Song Title</span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/soundEngine.js"></script>
  <script src="js/data.js"></script>
  <script src="js/pwaInstall.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
